<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bg)" opacity="0.95"/>
  <polygon points="40,8 68,24 68,56 40,72 12,56 12,24" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <!-- Radar dish -->
  <path d="M24,42 Q40,16 56,42 Z" fill="#c4b5fd" filter="url(#glow)"/>
  <path d="M26,43 Q40,20 54,43" fill="none" stroke="#ede9fe" stroke-width="1.5" opacity="0.6"/>
  <!-- Dish stand -->
  <rect x="38" y="42" width="4" height="14" rx="2" fill="#c4b5fd"/>
  <rect x="32" y="55" width="16" height="4" rx="2" fill="#c4b5fd"/>
  <!-- Signal waves -->
  <path d="M40,30 Q47,26 54,30" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <path d="M40,24 Q50,18 60,24" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.4"/>
  <ellipse cx="28" cy="22" rx="8" ry="4" fill="white" opacity="0.15" transform="rotate(-30 28 22)"/>
</svg>
