<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#7f0000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base hexagon -->
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bg)" opacity="0.95"/>
  <polygon points="40,8 68,24 68,56 40,72 12,56 12,24" fill="none" stroke="#ff9999" stroke-width="1.5" opacity="0.5"/>
  <!-- Cross -->
  <rect x="32" y="20" width="16" height="40" rx="3" fill="white" filter="url(#glow)" opacity="0.95"/>
  <rect x="20" y="32" width="40" height="16" rx="3" fill="white" filter="url(#glow)" opacity="0.95"/>
  <!-- Shine -->
  <ellipse cx="28" cy="22" rx="8" ry="4" fill="white" opacity="0.15" transform="rotate(-30 28 22)"/>
</svg>
