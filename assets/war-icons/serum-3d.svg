<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" fill="url(#bg)" opacity="0.95"/>
  <polygon points="40,8 68,24 68,56 40,72 12,56 12,24" fill="none" stroke="#d8b4fe" stroke-width="1.5" opacity="0.5"/>
  <!-- Flask -->
  <path d="M35,16 L35,34 L24,56 Q22,62 29,64 L51,64 Q58,62 56,56 L45,34 L45,16 Z" fill="#f3e8ff" filter="url(#glow)" opacity="0.95"/>
  <rect x="34" y="14" width="12" height="4" rx="2" fill="#e9d5ff"/>
  <!-- Liquid inside -->
  <path d="M27,56 Q25,62 29,63 L51,63 Q55,62 53,56 L43,36 L37,36 Z" fill="#c084fc" opacity="0.8"/>
  <!-- Bubbles -->
  <circle cx="35" cy="54" r="2.5" fill="white" opacity="0.5"/>
  <circle cx="43" cy="58" r="2" fill="white" opacity="0.4"/>
  <circle cx="38" cy="60" r="1.5" fill="white" opacity="0.3"/>
  <!-- Cross on flask -->
  <rect x="38" y="22" width="4" height="10" rx="1.5" fill="#a855f7"/>
  <rect x="35" y="25" width="10" height="4" rx="1.5" fill="#a855f7"/>
  <ellipse cx="28" cy="20" rx="6" ry="3" fill="white" opacity="0.15" transform="rotate(-30 28 20)"/>
</svg>
